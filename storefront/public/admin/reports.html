<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التقارير المالية - عطور النخبة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --gold: #d4af37; --bg: #0f172a; --success: #10b981; --danger: #ef4444; }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--bg); color: white; }
        header {
            background: rgba(0,0,0,0.85); backdrop-filter: blur(14px);
            padding: 12px 4%; display: flex; align-items: center; gap: 12px;
            border-bottom: 1px solid rgba(212,175,55,0.25); position: sticky; top: 0; z-index: 100;
        }
        .logo { color: var(--gold); font-weight: 700; font-size: 1.1rem; white-space: nowrap; }
        nav {
            display: flex; gap: 4px; background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 5px;
            flex-wrap: wrap; margin-right: auto;
        }
        nav a {
            text-decoration: none; color: rgba(255,255,255,0.6); font-size: 0.8rem; font-weight: 600;
            padding: 6px 12px; border-radius: 9px; transition: all 0.25s; white-space: nowrap;
            display: flex; align-items: center; gap: 4px;
        }
        nav a:hover { color: white; background: rgba(255,255,255,0.08); }
        nav a.active { background: linear-gradient(135deg, #d4af37, #b8860b); color: #000; box-shadow: 0 3px 10px rgba(212,175,55,0.3); }
        .container { padding: 20px; max-width: 1000px; margin: auto; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .stat-box { background: #1f2937; padding: 20px; border-radius: 15px; text-align: center; border: 1px solid rgba(255,255,255,0.05); }
        .stat-box h4 { margin: 0; color: #cbd5e1; font-size: 0.9rem; }
        .stat-box p { margin: 10px 0 0; font-size: 1.5rem; font-weight: bold; }
        
        .profit { color: var(--success); }
        .loss { color: var(--danger); }
        
        .chart-container { background: #1f2937; padding: 20px; border-radius: 15px; margin-top: 20px; }
        canvas { max-height: 300px; }
    </style>
</head>
<body>

<header>
    <span class="logo">📊 التقارير المالية</span>
    <nav>
        <a href="index.html">🏠 الرئيسية</a>
        <a href="sales.html">💰 المبيعات</a>
        <a href="manage.html">📦 المخزون</a>
        <a href="expenses.html">📉 المصاريف</a>
        <a href="reports.html" class="active">📊 التقارير</a>
    </nav>
</header>

<div class="container">
    <div class="stats-grid">
        <div class="stat-box">
            <h4>إجمالي المبيعات</h4>
            <p id="totalSales">0</p>
        </div>
        <div class="stat-box">
            <h4>إجمالي المصاريف</h4>
            <p id="totalExpenses" class="loss">0</p>
        </div>
        <div class="stat-box">
            <h4>إجمالي الأرباح (قبل المصاريف)</h4>
            <p id="grossProfit" class="profit">0</p>
        </div>
        <div class="stat-box" style="border: 2px solid var(--gold);">
            <h4>صافي الربح الحقيقي</h4>
            <p id="netProfit" style="color: var(--gold);">0</p>
        </div>
    </div>

    <div class="chart-container">
        <h3 style="text-align: center; color: var(--gold);">مقارنة المبيعات والمصاريف</h3>
        <canvas id="financeChart"></canvas>
    </div>
</div>

<script type="module">
    import { db } from "./firebase-config.js";
    import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    async function loadReports() {
        let totalSalesVal = 0;
        let totalProfitVal = 0;
        let totalExpensesVal = 0;

        // 1. جلب المبيعات والأرباح
        const salesSnap = await getDocs(collection(db, "sales"));
        salesSnap.forEach(doc => {
            const data = doc.data();
            totalSalesVal += data.totalSale || 0;
            totalProfitVal += data.profit || 0;
        });

        // 2. جلب المصاريف
        const expensesSnap = await getDocs(collection(db, "expenses"));
        expensesSnap.forEach(doc => {
            const data = doc.data();
            totalExpensesVal += data.amount || 0;
        });

        // 3. الحسابات النهائية
        const netProfit = totalProfitVal - totalExpensesVal;

        // تحديث الواجهة
        document.getElementById("totalSales").innerText = totalSalesVal.toLocaleString() + " ريال";
        document.getElementById("totalExpenses").innerText = totalExpensesVal.toLocaleString() + " ريال";
        document.getElementById("grossProfit").innerText = totalProfitVal.toLocaleString() + " ريال";
        document.getElementById("netProfit").innerText = netProfit.toLocaleString() + " ريال";

        // رسم الرسم البياني
        initChart(totalSalesVal, totalExpensesVal, netProfit);
    }

    function initChart(sales, expenses, net) {
        const ctx = document.getElementById('financeChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['المبيعات', 'المصاريف', 'صافي الربح'],
                datasets: [{
                    label: 'التحليل المالي (ريال)',
                    data: [sales, expenses, net],
                    backgroundColor: ['#d4af37', '#ef4444', '#10b981'],
                    borderRadius: 8
                }]
            },
            options: {
                responsive: true,
                plugins: { legend: { display: false } },
                scales: { y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.1)' } } }
            }
        });
    }

    loadReports();
</script>
</body>
</html>
