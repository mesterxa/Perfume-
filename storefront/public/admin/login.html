<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دخول الإدارة — عطور النخبة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Cairo', sans-serif;
            background: #030d1a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            overflow: hidden;
        }

        /* Animated background */
        .bg {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 60% 50% at 20% 30%, rgba(13,148,136,0.12) 0%, transparent 70%),
                radial-gradient(ellipse 50% 60% at 80% 70%, rgba(212,175,55,0.07) 0%, transparent 70%),
                #030d1a;
            z-index: 0;
        }

        /* Floating orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.25;
            animation: float 8s ease-in-out infinite;
            z-index: 0;
        }
        .orb-1 { width: 300px; height: 300px; background: #0d9488; top: -100px; right: -100px; animation-delay: 0s; }
        .orb-2 { width: 200px; height: 200px; background: #d4af37; bottom: -80px; left: -60px; animation-delay: -3s; }
        @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-25px)} }

        .card-wrap {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 16px;
        }

        /* Brand */
        .brand {
            text-align: center;
            margin-bottom: 32px;
        }
        .brand-logo {
            width: 64px; height: 64px; border-radius: 20px;
            background: linear-gradient(135deg, #0d9488, #14b8a6);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 14px;
            box-shadow: 0 8px 30px rgba(13,148,136,0.35);
            font-size: 26px;
        }
        .brand-name {
            font-size: 1.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #d4af37, #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .brand-sub { font-size: 0.8rem; color: rgba(255,255,255,0.4); margin-top: 4px; letter-spacing: 0.05em; }

        /* Card */
        .card {
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px;
            padding: 36px 32px;
        }
        .card-title {
            text-align: center;
            font-size: 1.1rem;
            font-weight: 700;
            color: rgba(255,255,255,0.85);
            margin-bottom: 28px;
        }

        /* Form */
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 0.78rem; font-weight: 600; color: rgba(255,255,255,0.5); margin-bottom: 8px; letter-spacing: 0.03em; }
        input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.05);
            color: white;
            font-family: 'Cairo', sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.25s, background 0.25s;
            text-align: right;
        }
        input::placeholder { color: rgba(255,255,255,0.3); }
        input:focus {
            border-color: rgba(13,148,136,0.5);
            background: rgba(13,148,136,0.07);
        }

        /* Button */
        .btn {
            width: 100%;
            padding: 15px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, #0d9488, #14b8a6);
            color: white;
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 8px;
            box-shadow: 0 6px 20px rgba(13,148,136,0.3);
            letter-spacing: 0.02em;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(13,148,136,0.4); filter: brightness(1.1); }
        .btn:active { transform: translateY(0); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        /* Error */
        #errorBox {
            display: none;
            background: rgba(239,68,68,0.12);
            border: 1px solid rgba(239,68,68,0.25);
            color: #f87171;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.85rem;
            margin-bottom: 16px;
            text-align: center;
        }

        /* Divider */
        .divider {
            display: flex; align-items: center; gap: 12px;
            margin: 24px 0;
        }
        .divider-line { flex: 1; height: 1px; background: rgba(255,255,255,0.07); }
        .divider-text { font-size: 0.75rem; color: rgba(255,255,255,0.3); }

        /* Store link */
        .store-link {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 13px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.07);
            background: rgba(255,255,255,0.03);
            color: rgba(255,255,255,0.5);
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.25s;
        }
        .store-link:hover { border-color: rgba(212,175,55,0.3); color: rgba(255,255,255,0.8); background: rgba(212,175,55,0.05); }

        /* Loading spinner */
        .spinner {
            display: inline-block;
            width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-left: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="bg"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="card-wrap">
        <div class="brand">
            <div class="brand-logo">💎</div>
            <div class="brand-name">عطور النخبة</div>
            <div class="brand-sub">Elite Perfumes — لوحة الإدارة</div>
        </div>

        <div class="card">
            <div class="card-title">تسجيل دخول المسؤول</div>
            <div id="errorBox"></div>

            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" id="email" placeholder="admin@eliteperfumes.com">
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>

            <button class="btn" id="loginBtn">دخول للنظام</button>

            <div class="divider">
                <div class="divider-line"></div>
                <div class="divider-text">أو</div>
                <div class="divider-line"></div>
            </div>

            <a href="/" class="store-link">
                <span>🏪</span> الذهاب إلى المتجر
            </a>
        </div>
    </div>

    <script type="module">
        import { auth, db } from "./firebase-config.js";
        import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const loginBtn = document.getElementById("loginBtn");
        const errorBox = document.getElementById("errorBox");

        async function doLogin() {
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            errorBox.style.display = "none";

            if (!email || !password) {
                errorBox.innerText = "يرجى ملء جميع الحقول";
                errorBox.style.display = "block";
                return;
            }

            loginBtn.disabled = true;
            loginBtn.innerHTML = 'جاري الدخول... <span class="spinner"></span>';

            try {
                const cred = await signInWithEmailAndPassword(auth, email, password);
                const snap = await getDoc(doc(db, "users", cred.user.uid));

                if (snap.exists() && (snap.data().role === "admin" || snap.data().role === "seller")) {
                    window.location.href = "index.html";
                } else {
                    errorBox.innerText = "ليس لديك صلاحية دخول";
                    errorBox.style.display = "block";
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = "دخول للنظام";
                }
            } catch {
                errorBox.innerText = "البريد الإلكتروني أو كلمة المرور غير صحيحة";
                errorBox.style.display = "block";
                loginBtn.disabled = false;
                loginBtn.innerHTML = "دخول للنظام";
            }
        }

        loginBtn.addEventListener("click", doLogin);
        document.getElementById("password").addEventListener("keydown", e => {
            if (e.key === "Enter") doLogin();
        });
    </script>
</body>
</html>
